<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — Enemigos VAELDRYN</title>
<style>
  body { background:#14161c; color:#ddd; font-family:sans-serif; margin:0; }
  canvas { display:block; margin:0 auto; background:#1c2230; }
  h1{text-align:center;font-size:15px;margin:8px 0 4px;color:#8af}
  p{text-align:center;font-size:11px;color:#667;margin:0 0 8px}
</style>
</head>
<body>
<h1>Vista previa de enemigos — VAELDRYN</h1>
<p>Humanoides · Criaturas · Jefes</p>
<canvas id="cv" width="920" height="920"></canvas>
<script src="js/artkit.js"></script>
<script src="js/enemies.js"></script>
<script>
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.lineJoin='round'; ctx.lineCap='round';

function st(r,opts){
  var o={r:r||26, walk:1.0, atk:0, anim:1.5, freeze:false, flying:false, flap:0.6, enraged:false, ghost:1};
  if(opts) for(var k in opts) o[k]=opts[k]; return o;
}

function specs(name){
  try { return Enemy.prototype._spec.call({type:name}); } catch(e){ return {skin:'#888',head:'human',weapon:'club',headR:0.52,torso:0.9}; }
}

var all=[
  // humanoidos (tipo, radio, opts)
  ['goblin',25],['orc',30],['berserker',30],['skeleton',27],['undead',27],
  ['troll',34],['necromancer',28],['orcKing',33],['lord',32],['voidWalker',29],
  ['saboteur',25],['assassin',26],['thief',26],['hulker',34],['gargoyle',32],
  ['shaman',29],['demon',32],['lich',29],['sorcerer',28]
];
var art=[['art:stoneGolem',36],['art:fireGolem',36],['art:bat',24],['art:wisp',20],['art:crawler',28]];
var bosses=[
  ['dragon',42,false],['iceDragon',42,true],['treant',40],['warMachine',40],
  ['voidLord',38],['iceWraith',32],['stormSpirit',32]
];

var cols=6, sx=70, sy=55, cw=138, ch=130;

function drawHumanoid(name,r,x,y){
  ctx.save(); ctx.translate(x,y);
  ART.figure(ctx, specs(name), st(r));
  ctx.restore();
  ctx.fillStyle='#8af'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
  ctx.fillText(name, x, y+r*1.7+12);
}

function drawArt(name,r,x,y){
  ctx.save(); ctx.translate(x,y);
  var s=st(r);
  if(name==='art:stoneGolem') ART.stoneGolem(ctx,r,s);
  else if(name==='art:fireGolem') ART.fireGolem(ctx,r,s);
  else if(name==='art:bat') ART.bat(ctx,r,s);
  else if(name==='art:wisp') ART.wisp(ctx,r,s);
  else if(name==='art:crawler') ART.spider(ctx,r,s);
  ctx.restore();
  ctx.fillStyle='#8af'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
  ctx.fillText(name.replace('art:',''), x, y+r*1.7+12);
}

function drawBoss(name,r,x,y,ice){
  ctx.save(); ctx.translate(x,y);
  var s=st(r);
  if(name==='dragon') Enemy.prototype._drawDragon.call({},ctx,s,false);
  else if(name==='iceDragon') Enemy.prototype._drawDragon.call({},ctx,s,true);
  else if(name==='treant') Enemy.prototype._drawTreant.call({},ctx,s);
  else if(name==='warMachine') Enemy.prototype._drawWarMachine.call({},ctx,s);
  else if(name==='voidLord') Enemy.prototype._drawVoidLord.call({},ctx,s);
  else if(name==='iceWraith') Enemy.prototype._drawIceWraith.call({},ctx,s);
  else if(name==='stormSpirit') Enemy.prototype._drawStormSpirit.call({},ctx,s);
  ctx.restore();
  ctx.fillStyle='#fa3'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
  ctx.fillText(name, x, y+Math.max(r*1.7,42)+14);
}

// --- dibujar ---
// humanoidos
ctx.fillStyle='#5a6a8a'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
ctx.fillText('HUMANOIDES', cw*cols/2+sx, sy-16);
all.forEach(function(e,i){
  drawHumanoid(e[0],e[1], sx+(i%cols)*cw, sy+Math.floor(i/cols)*ch);
});

// criaturas art
var artY=sy+Math.ceil(all.length/cols)*ch+20;
ctx.fillStyle='#5a6a8a'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
ctx.fillText('CRIATURAS', cw*cols/2+sx, artY-16);
art.forEach(function(e,i){
  drawArt(e[0],e[1], sx+(i%cols)*cw, artY+Math.floor(i/cols)*ch);
});

// jefes
var bossY=artY+Math.ceil(art.length/cols)*ch+30;
ctx.fillStyle='#fa3'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
ctx.fillText('JEFES', cw*cols/2+sx, bossY-16);
bosses.forEach(function(e,i){
  drawBoss(e[0],e[1], sx+(i%cols)*cw, bossY+Math.floor(i/cols)*ch+10, e[2]);
});

// footer
ctx.fillStyle='#445'; ctx.font='10px sans-serif'; ctx.textAlign='center';
ctx.fillText('Generated from js/artkit.js + js/enemies.js', cv.width/2, cv.height-10);
</script>
</body>
</html>
