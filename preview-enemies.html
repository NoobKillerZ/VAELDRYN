<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — NPCs de VAELDRYN (enemigos + torres)</title>
<style>
  body { background:#14161c; color:#ddd; font-family:sans-serif; margin:0; }
  canvas { display:block; margin:0 auto; background:#1c2230; }
  h1{text-align:center;font-size:15px;margin:8px 0 4px;color:#8af}
  p{text-align:center;font-size:11px;color:#667;margin:0 0 8px}
</style>
</head>
<body>
<h1>Vista previa de NPCs — VAELDRYN (enemigos · torres · soldados)</h1>
<p>Renderizado en vivo desde js/artkit.js + js/enemies.js + js/towers.js + js/config.js</p>
<canvas id="cv" width="1240" height="1750"></canvas>
<script>
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}
</script>
<script src="js/config.js"></script>
<script src="js/sprites.js"></script>
<script src="js/artkit.js"></script>
<script src="js/enemies.js"></script>
<script src="js/towers.js"></script>
<script>
if (typeof SPRITES !== 'undefined') {
  var _pk = [];
  Object.keys(ENEMIES).forEach(function (k) { _pk.push(['e', k]); });
  TOWER_TYPES.forEach(function (k) { _pk.push(['t', k]); });
  Object.keys(SOLDIER_TYPES).forEach(function (k) { _pk.push(['s', k]); });
  SPRITES.preload(_pk);
}
</script>
<script>
setTimeout(function () {
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.lineJoin = 'round'; ctx.lineCap = 'round';
var T = 1.35; // fase de animación congelada (zancada media)

function st(r, opts) {
  var o = { r: r, walk: T * 4, atk: 0, anim: T * 5, freeze: false, flying: false,
    flap: 0.6, blink: false, face: 1, enraged: false, ghost: 1,
    hurt: 0, death: -1, spawn: 0 };
  if (opts) for (var k in opts) o[k] = opts[k];
  return o;
}

// ---------- ENEMIGOS ----------
function drawEnemy(type, def, x, y, cell) {
  var r = def.r || 12;
  var scale = Math.min(3.2, Math.max(1.2, 30 / r));
  ctx.save();
  ctx.translate(x, y + 6);
  ctx.scale(scale, scale);
  var spec;
  try { spec = Enemy.prototype._spec.call({ type: type, color: def.color }); }
  catch (e) { spec = { skin: def.color, head: 'human', weapon: 'club', headR: 0.52, torso: 0.9 }; }
  if (typeof SPRITES !== 'undefined' && SPRITES.draw(ctx, 'e', type, 0, 10, r * 3.1, 0, null)) { ctx.restore(); return; }
  try {
    if (typeof spec === 'string') {
      if (spec === 'art:fireGolem') ART.fireGolem(ctx, r, st(r));
      else if (spec === 'art:stoneGolem') ART.stoneGolem(ctx, r, st(r));
      else if (spec === 'art:bat') ART.bat(ctx, r, st(r));
      else if (spec === 'art:wisp') ART.wisp(ctx, r, st(r));
      else if (spec === 'art:crawler') ART.spider(ctx, r, st(r));
      else if (spec === 'dragon') Enemy.prototype._drawDragon.call({}, ctx, st(r), false);
      else if (spec === 'iceDragon') Enemy.prototype._drawDragon.call({}, ctx, st(r), true);
      else if (spec === 'treant') Enemy.prototype._drawTreant.call({}, ctx, st(r));
      else if (spec === 'warMachine') Enemy.prototype._drawWarMachine.call({}, ctx, st(r));
      else if (spec === 'voidLord') Enemy.prototype._drawVoidLord.call({}, ctx, st(r));
      else if (spec === 'iceWraith') Enemy.prototype._drawIceWraith.call({}, ctx, st(r));
      else if (spec === 'stormSpirit') Enemy.prototype._drawStormSpirit.call({}, ctx, st(r));
    } else {
      ART.figure(ctx, spec, st(r, type === 'berserker' || type === 'hulker' ? { atk: 0.42 } : null));
    }
  } catch (e) { }
  ctx.restore();
  ctx.fillStyle = def.boss ? '#fa3' : '#8af';
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(def.name, x, y + cell * 0.44);
}

// ---------- TORRES ----------
var stubGame = { time: T, wave: 8, enemies: [], projectiles: [], particles: [], texts: [],
  lightning: [], soldiers: [], towers: [], weatherMult: function () { return 1; }, corruption: {}, corruptTotal: 0 };

function drawTower(type, x, y) {
  var tower = null;
  try { tower = new Tower(1, 1, type, stubGame); } catch (e) { }
  ctx.save();
  ctx.translate(x, y + 8);
  ctx.scale(2.1, 2.1);
  if (tower) {
    tower.x = 0; tower.y = 0;
    tower.aim = -Math.PI / 2 + 0.3;
    try { tower.draw(ctx, stubGame); } catch (e) { }
  }
  ctx.restore();
  ctx.fillStyle = '#7f7';
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText(TOWERS[type].name, x, y + 52);
}

// ---------- SOLDADOS ----------
function drawSoldier(stype, x, y) {
  var s = null;
  try { s = new AlliedSoldier(0, 0, stype, { hp: 100, dmg: 12, rate: 0.8, range: 28 }, null); } catch (e) { }
  ctx.save();
  ctx.translate(x, y + 10);
  ctx.scale(3.1, 3.1);
  if (s) { s.anim = T; s.facing = 0.2; try { s.draw(ctx); } catch (e) { } }
  ctx.restore();
  ctx.fillStyle = '#fc8';
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
  ctx.fillText({ swordsman: 'Espadachín', archer: 'Arquero', shieldbearer: 'Portaescudos', mage: 'Mago' }[stype] || stype, x, y + 46);
}

// ---------- COMPOSICIÓN ----------
function sectionTitle(txt, y, col) {
  ctx.fillStyle = col; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText(txt, cv.width / 2, y);
}

var y = 46;
// TORRES
sectionTitle('— TORRES ALIADAS (14) —', y, '#7f7');
var tY = y + 26, tCols = 7, tCell = 168;
TOWER_TYPES.forEach(function (type, i) {
  drawTower(type, 100 + (i % tCols) * tCell + tCell / 2 - 60, tY + Math.floor(i / tCols) * 118);
});
y = tY + Math.ceil(TOWER_TYPES.length / tCols) * 118 + 18;

// SOLDADOS
sectionTitle('— SOLDADOS ALIADOS (4) —', y, '#fc8');
var sY = y + 26, sCols = 4, sCell = 290;
Object.keys(SOLDIER_TYPES).forEach(function (stype, i) {
  drawSoldier(stype, 155 + i * sCell, sY);
});
y = sY + 96;

// JEFES
var bossKeys = Object.keys(ENEMIES).filter(function (k) { return ENEMIES[k].boss; });
sectionTitle('— JEFES DEL CAOS (' + bossKeys.length + ') —', y, '#fa3');
var bY = y + 26, bCols = 7, bCell = 168;
bossKeys.forEach(function (k, i) {
  drawEnemy(k, ENEMIES[k], 100 + (i % bCols) * bCell + bCell / 2 - 60, bY + Math.floor(i / bCols) * 128, bCell);
});
y = bY + Math.ceil(bossKeys.length / bCols) * 128 + 18;

// ENEMIGOS
var commonKeys = Object.keys(ENEMIES).filter(function (k) { return !ENEMIES[k].boss; })
  .sort(function (a, b) { return ENEMIES[a].hp - ENEMIES[b].hp; });
sectionTitle('— ENEMIGOS (' + commonKeys.length + ') —', y, '#8af');
var eY = y + 26, eCols = 8, eCell = 150;
commonKeys.forEach(function (k, i) {
  drawEnemy(k, ENEMIES[k], 78 + (i % eCols) * eCell + eCell / 2 - 55, eY + Math.floor(i / eCols) * 118, eCell);
});
y = eY + Math.ceil(commonKeys.length / eCols) * 118 + 10;

ctx.fillStyle = '#445'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
ctx.fillText('VAELDRYN ' + (typeof GAME_VERSION !== 'undefined' ? GAME_VERSION : '') + ' — generado desde el código del juego', cv.width / 2, y + 8);
}, 900);
</script>
</body>
</html>
